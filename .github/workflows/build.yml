name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.25-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.25-

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v ./cmd/nimsforestmastery

    - name: Build for multiple architectures
      if: matrix.os == 'ubuntu-latest'
      run: |
        GOOS=linux GOARCH=amd64 go build -o nimsforestmastery-linux-amd64 ./cmd/nimsforestmastery
        GOOS=linux GOARCH=arm64 go build -o nimsforestmastery-linux-arm64 ./cmd/nimsforestmastery
        GOOS=darwin GOARCH=amd64 go build -o nimsforestmastery-darwin-amd64 ./cmd/nimsforestmastery
        GOOS=darwin GOARCH=arm64 go build -o nimsforestmastery-darwin-arm64 ./cmd/nimsforestmastery
        GOOS=windows GOARCH=amd64 go build -o nimsforestmastery-windows-amd64.exe ./cmd/nimsforestmastery

    - name: Upload artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: nimsforestmastery-*
